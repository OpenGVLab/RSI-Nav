# @package _global_
# habitat-lab v0.3.x compatible config for R2R VLN evaluation.
#
# Key differences from the old v0.1.x config:
#  - sensor_setups@ replaces agents@ for the sensor group override
#  - oracle_success / oracle_navigation_error are NOT listed here;
#    they are injected programmatically in r2r.py via measurements.update()
#    (habitat-lab v0.3.x does not ship these measures natively).

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - _self_

habitat:
  environment:
    max_episode_steps: 500
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
  dataset:
    type: R2RVLN-v1
    split: val_unseen
    scenes_dir: xxx/RSI-Nav/data/scene/
    data_path: xxx/RSI-Nav/data/datasets/r2r/{split}/{split}.json.gz